# 打包配置。先运行 `node scripts/stage.mjs` 把后端、前端和更新日志放进 stage/，这里再把它们作为 extraResources 装进安装包。
# 后端不能放进 asar：它是要被执行的独立程序。
appId: io.github.crazyjums.mosaic
productName: Mosaic
copyright: crazyjums
directories:
  output: release
  buildResources: build
# 应用图标：用仓库里的 Mosaic 图标（Wails 版也在用）。不写的话 electron-builder 会退回 Electron 默认图标。
# macOS 的 .icns 和 Linux 的图标由这张 1024px 的 PNG 生成；Windows 用现成的多尺寸 .ico（16–256）。
icon: ../build/appicon.png
files:
  - dist/src/**
  - package.json
  # Claude Agent SDK 的平台包里是 300MB 以上的原生 claude 可执行文件：不打包，用用户自己装的 claude 命令（见 workers/claudecode.ts）。
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
asar: true
# 引擎 worker 跑在 utilityProcess 里，要像普通进程一样 import SDK，所以连同 SDK 一起放在 asar 外面（harness-electron.ts 的 workerPath）。
asarUnpack:
  - dist/src/workers/**
  - node_modules/@anthropic-ai/claude-agent-sdk/**
# 发布由工作流负责（阶段 3 才接自动更新），这里不让 electron-builder 自己去找发布目标。
publish: null
extraResources:
  # pi 的 SDK 用它自带的打包版（见 workers/pi-locate.ts），不放它那两万多个依赖文件。
  - from: node_modules/@earendil-works/pi-coding-agent/dist/bundle/
    to: pi/
  - from: resources/pi-package.json
    to: pi/package.json
  - from: stage/
    to: .
    filter:
      - "mosaicd*"
      - frontend/**
      - CHANGELOG.md
      - icon.png
# 测试版和正式版的安装包文件名里带上平台和架构，方便在 Release 页面区分。
artifactName: Mosaic-${version}-${os}-${arch}.${ext}
win:
  icon: ../build/windows/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  # 安装程序、卸载程序和安装界面的图标跟应用一致（默认就取 win.icon，这里写明避免回退成 NSIS 默认图标）。
  installerIcon: ../build/windows/icon.ico
  uninstallerIcon: ../build/windows/icon.ico
  installerHeaderIcon: ../build/windows/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development
mac:
  # macOS 的图标四周要留约 10% 边距（Apple 模板：1024 画布里图形占 824），否则比别的应用大一圈。
  icon: resources/mac-icon.png
  target:
    - target: dmg
    - target: zip
  category: public.app-category.developer-tools
  # 暂无开发者证书：不签名，不让 electron-builder 去钥匙串里找身份。
  identity: null
