# myllmapp 配置示例
#
# 使用方法：复制为 config.toml（当前目录）或 ~/.myllmapp/config.toml，按需修改。
#   cp config.example.toml config.toml
# config.toml 已在 .gitignore 中，不会被提交。也可以用环境变量 MYLLMAPP_CONFIG 或 CLI 的 -config 指定路径。
#
# 密钥：推荐只写 api_key_env（环境变量名），在 shell 里 export 密钥；不要把密钥写进任何会被提交的文件。

# 启动时默认使用的厂商配置档（下面 [[providers]] 的 name）和模型。
# 留空模型则使用该配置档的 default_model。
default_provider = ""
default_model = ""

# 工具的工作区根目录。读写文件、执行命令都限定在这个目录里。相对路径相对于启动时的当前目录。
# 桌面端：留空或 "." 时使用 <data_dir>/workspace（从 Finder / 开始菜单启动时"当前目录"没有意义），
# 想让桌面端操作某个项目，请写绝对路径。CLI 的 "." 就是运行命令时所在的目录。
workspace = "."

# 本地数据目录（会话数据库 sessions.db）。留空为 ~/.myllmapp
data_dir = ""

# 权限模式（启动时的档位；桌面端可在状态栏、CLI 可用 /mode 随时切换。
# 切换会被记住并优先于这里的设置，但 auto 除外——全部放行只对当次运行有效）：
#   readonly     —— 只允许读操作，写和执行直接拒绝
#   default      —— 读操作自动放行，写文件和执行命令每次都需要确认（推荐）
#   accept_edits —— 读写文件自动放行，执行命令仍需确认
#   auto         —— 全部自动放行（只在一次性沙箱目录里使用！）
permission_mode = "default"

# 一轮对话中最多调用模型的次数（防止死循环烧钱）。0 表示使用默认值 50。也可以在 设置 → 常规 里修改。
max_steps = 50

# 单次模型输出上限。0 表示由各适配器决定（Anthropic 默认 64000，OpenAI 兼容默认不传）。
max_tokens = 0

# shell 工具单条命令超时（秒）。0 表示默认 60 秒。
shell_timeout_seconds = 60

# 打开历史会话时先加载最近多少轮对话（一轮 = 一次用户发言和模型的回复）。更早的内容在界面上点"加载更早的"再取。
# 会话很长时调小可以打开得更快。只影响界面显示，不影响发给模型的上下文。0 表示默认 20。也可以在 设置 → 常规 里修改。
history_turns = 20

# 自定义系统提示词。留空使用内置的（见 internal/bootstrap/bootstrap.go 的 DefaultSystemPrompt）。
system_prompt = ""

# ---------------------------------------------------------------------------
# 厂商配置档。type 是适配器类型：fake / openai（OpenAI 兼容协议）/ anthropic（原生协议）。
# 同一个 type 可以有多个配置档，只是 base_url、密钥、模型不同。
# ---------------------------------------------------------------------------

# 离线演示 / 测试用的假厂商，不需要密钥，按固定剧本回复、不调用真实模型。内置默认配置不再带它；
# 想体验界面或写测试时，去掉下面每行开头的 # 即可。
# [[providers]]
# name = "fake"
# type = "fake"
# models = ["demo", "echo"]   # 模型名为 echo 时复述输入，其他名字按 scenario 剧本回复
# default_model = "demo"
# [providers.options]
# scenario = "demo"           # demo / echo
# delay_ms = 25               # 每个流式片段的延迟，让"流式"看得见
# # script = "path/to/script.json"   # 自定义剧本，格式见 internal/provider/fake/fake.go 的 Script

# Anthropic 原生协议：保留思考块和签名。
[[providers]]
name = "anthropic"
type = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
# base_url = "https://api.anthropic.com"
models = ["claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]
default_model = "claude-opus-5-5"
[providers.options]
thinking = "adaptive"       # adaptive：开启自适应思考并返回可读的思考摘要；omit：不发送 thinking 参数
effort = "medium"           # low / medium / high / xhigh / max，留空使用模型默认值
refusal_fallback = true     # 请求被安全策略拒绝时由服务端自动换模型重试（fallbacks="default"）

# 每个模型的上下文窗口（tokens）和单价（美元 / 百万 token），只用于状态栏显示上下文占用和预估花费。
# 价格以官网为准；不填则状态栏不显示对应的比例 / 花费。其他厂商也可以这样配置。
[providers.options.models_meta.claude-opus-5-5]
context_window = 1000000
input_price = 4
output_price = 20

[providers.options.models_meta.claude-sonnet-5-5]
context_window = 1000000
input_price = 2
output_price = 10

[providers.options.models_meta.claude-haiku-5-5]
context_window = 1000000
input_price = 0.1
output_price = 0.5

# OpenAI 官方。
[[providers]]
name = "openai"
type = "openai"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"
models = ["gpt-4o-mini"]
[providers.options]
max_tokens_field = "max_completion_tokens"   # OpenAI 新模型使用这个字段名

# DeepSeek（OpenAI 兼容，deepseek-reasoner 会返回 reasoning_content 思考内容）。
[[providers]]
name = "deepseek"
type = "openai"
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com/v1"
models = ["deepseek-chat", "deepseek-reasoner"]

# 通义千问（DashScope 的 OpenAI 兼容模式）。
[[providers]]
name = "qwen"
type = "openai"
api_key_env = "DASHSCOPE_API_KEY"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
models = ["qwen-plus", "qwen-max"]

# 本地 Ollama（无需密钥）。
[[providers]]
name = "ollama"
type = "openai"
base_url = "http://localhost:11434/v1"
models = ["qwen2.5:7b"]
[providers.options]
allow_no_key = true
