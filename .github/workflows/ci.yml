name: ci

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Go unit tests
        run: go test ./... -count=1
      - name: Frontend install and checks
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p .
          npx vitest run

  # 只有 master 上的全部平台测试成功后，才考虑自动发布。
  release_candidate:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: 从最新 CHANGELOG 小节决定待发布 Tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # 旧提交的 CI 即使较晚结束，也不能发布已经过时的代码。
          current="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "master 已更新，跳过旧提交的发布"
            exit 0
          fi
          version="$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p' CHANGELOG.md | head -n 1)"
          if [ -z "$version" ]; then
            echo "CHANGELOG.md 没有可发布的版本小节"
            exit 0
          fi
          tag="v$version"
          # 已有 Tag 即视为已处理，不因其他不相关 PR 重复发布。
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "$tag 已存在，跳过发布"
            exit 0
          fi
          echo "准备发布 $tag（经全平台测试的提交 $GITHUB_SHA）"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # 复用现有 Release 工作流的构建、签名和上传步骤，仍保留手动发布入口。
  auto_release:
    needs: release_candidate
    if: needs.release_candidate.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release_candidate.outputs.tag }}
    secrets: inherit
