name: ci

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Go unit tests
        run: go test ./... -count=1
      - name: Frontend install and checks
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p .
          npx vitest run

  # Electron 外壳（迁移中，见 docs/design/electron-migration.md）：类型检查和单元测试（含用真实的 mosaicd 验证协议）三个平台都跑；
  # 冒烟测试（在真实的 Electron 窗口里加载前端、通过 IPC 跑完一轮演示对话）在 Linux 上用 xvfb 跑。
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      # Electron 的程序本体在第一次 require 时才从 GitHub Releases 下载，那里时不时 504，整个任务就红了。
      # 所以：下载目录放进缓存（版本不变就不再下载），没命中缓存时先单独下载、失败了等一会儿重试。
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
      - name: Desktop install
        working-directory: desktop
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          for i in 1 2 3 4; do
            node node_modules/electron/install.js && break
            if [ "$i" = 4 ]; then echo "Electron 下载连续失败 4 次"; exit 1; fi
            echo "Electron 下载失败，$((i * 20)) 秒后重试（第 $i 次）"
            sleep $((i * 20))
          done
      - name: Desktop typecheck and tests
        working-directory: desktop
        run: |
          npx tsc --noEmit -p .
          npm test
      - name: Smoke test in a real Electron window (Linux)
        if: runner.os == 'Linux'
        run: |
          (cd frontend && npm ci --no-audit --no-fund && npx vite build)
          go build -o "$RUNNER_TEMP/mosaicd" ./cmd/mosaicd
          cd desktop && MOSAIC_MOSAICD="$RUNNER_TEMP/mosaicd" node scripts/smoke.mjs

  # 合并到 master、全平台测试通过后自动发布：版本号加 0.0.1（CHANGELOG 最上面手写了更大且没打 tag 的版本就用它），
  # 把 [Unreleased] 写成这个版本的小节并提交回 master，再独立触发 release.yml（固定构建这个提交）。
  # 不想发布的合并：在 PR 标题里写 [skip release]（GitHub 的合并提交信息会带上 PR 标题）。
  auto_release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # 把写好的 CHANGELOG 提交回 master
      actions: write # 触发 release.yml
    # 同一时间只处理一次发布；排队的那次会因为 master 已经变了而跳过，它的内容会算进下一次。
    concurrency:
      group: auto-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 决定版本号并写入 CHANGELOG
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          # 旧提交的 CI 即使较晚结束，也不能发布已经过时的代码；它的改动会算进最新那次合并的发布里。
          current="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "master 已更新，跳过旧提交的发布"
            exit 0
          fi
          # 不用管道：grep -q 提前退出时 git 会收到 SIGPIPE，在 pipefail 下整个条件反而变成“不匹配”。
          if grep -qiF '[skip release]' <<<"$(git log -1 --format=%B)"; then
            echo "提交信息带 [skip release]，本次不发布"
            exit 0
          fi
          git fetch --tags --quiet
          git tag -l 'v*' > "$RUNNER_TEMP/tags.txt"
          prev="$(git tag -l 'v*' | grep -v -- - | sort -V | tail -n 1 || true)"
          git log --first-parent --format='%s%x1f%b%x1e' ${prev:+"$prev"..}HEAD > "$RUNNER_TEMP/log.txt"
          tag="$(go run ./cmd/mkmanifest bump -changelog CHANGELOG.md -tags-file "$RUNNER_TEMP/tags.txt" -log-file "$RUNNER_TEMP/log.txt")"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag 已存在，跳过重复发布"
            exit 0
          fi
          sha="$GITHUB_SHA"
          if ! git diff --quiet -- CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -q -m "chore(release): $tag [skip release]"
            # 用 GITHUB_TOKEN 推送的提交不会再触发 CI，不会循环。不强推：master 在这期间变了就放弃，交给下一次。
            if ! git push origin HEAD:master; then
              if [ "$(git ls-remote origin refs/heads/master | cut -f1)" != "$GITHUB_SHA" ]; then
                echo "master 在写更新日志期间又有了新提交，本次不发布，交给下一次合并"
                exit 0
              fi
              echo "::error::无法把更新日志推送到 master（可能开启了分支保护，需要允许 github-actions 推送）"
              exit 1
            fi
            sha="$(git rev-parse HEAD)"
          fi
          echo "准备发布 $tag（提交 $sha）"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: 独立触发 release 工作流
        if: steps.bump.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
          SHA: ${{ steps.bump.outputs.sha }}
        run: |
          set -euo pipefail
          # 防止 CI 重跑时，同一版本的发布已在构建但尚未创建 Tag。
          if gh run list --workflow release.yml --event workflow_dispatch \
            --json displayTitle,status --limit 100 \
            | jq -e --arg title "release $TAG" \
              'any(.[]; .displayTitle == $title and .status != "completed")' >/dev/null; then
            echo "$TAG 已有正在执行或排队的发布，跳过重复触发"
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref master -f tag="$TAG" -f sha="$SHA"
          echo "已请求发布：$TAG（提交 $SHA）；请到 Actions → release 查看运行记录"
