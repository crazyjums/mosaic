# 发布流水线：推送形如 v1.2.3 的 tag 时，在三个平台分别打包，生成并签名更新清单，创建 GitHub Release。
#
# 一次性准备（见 docs/design/auto-update.md）：
#   1. go run ./cmd/mkmanifest genkey
#   2. 公钥写进 internal/update/pubkey.txt 并提交
#   3. 私钥保存为仓库的加密变量 UPDATE_SIGNING_KEY（Settings → Secrets and variables → Actions）
# 发布方式（三选一）：
#   A. 命令行：git tag v1.2.3 && git push origin v1.2.3
#   B. 手动运行（手机上的 GitHub app 也行）：Actions → release → Run workflow，在 "tag" 里填 v1.2.3。
#      只能在默认分支上运行；tag 会在最后创建 Release 时一并创建，指向被运行的那个提交，所以不需要先建 tag。
#   C. 自动（默认）：每次合并到 master、CI 全平台测试通过后，ci.yml 自动把版本号加 0.0.1（或用 CHANGELOG 最上面
#      手写的更大版本），把 [Unreleased] 写成这个版本的小节并提交回 master，再用 workflow_dispatch 触发本工作流，
#      并通过 sha 输入固定构建的提交。不想发布的合并在 PR 标题里写 [skip release]。
#
# 带连字符的 tag（v1.2.3-beta.1）会标成预发布，不会成为"最新版本"，所以正式版用户不会收到它。

name: release
# 独立的 workflow_dispatch 运行在 Actions 中显示为「release v1.2.3」。
run-name: release ${{ inputs.tag || github.ref_name }}

# 同一版本的手动/自动发布不能并发创建相同 Tag 或覆盖资产。
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "经 CI 验证后自动发布的版本号，例如 v1.7.4"
        required: true
        type: string
      sha:
        description: "要构建的提交（可选，默认是触发时的分支最新提交）"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本，例如 v1.3.0（预发布：v1.3.0-beta.1）。必须在 CHANGELOG.md 里有对应小节"
        required: true
        type: string
      sha:
        description: "要构建的提交（可选，自动发布时由 ci.yml 传入；手动运行留空即可）"
        required: false
        type: string

# 下面各处的 TAG：tag 触发时是被推送的 tag，手动与自动 dispatch 时是输入的版本号。
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # 构建并打 tag 的提交：自动发布时固定为 ci.yml 写好更新日志的那个提交，避免中途又有合并进来、发出没测过的代码。
  BUILD_SHA: ${{ inputs.sha || github.sha }}

permissions:
  contents: write

jobs:
  # 第一步：确认签名密钥配置正确。没配好就在这里失败，而不是发布出一个谁都更新不了的版本。
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
      # workflow_dispatch 与 workflow_call 时没有 tag 约束，这里补上：格式要对、只能发默认分支、tag 不能已经存在。
      - name: 检查手动运行的参数
        if: inputs.tag != ''
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::版本号格式应为 v1.2.3 或 v1.2.3-beta.1，收到：$TAG"; exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            echo "::error::只能在默认分支（${{ github.event.repository.default_branch }}）上手动发布，当前是 $GITHUB_REF"; exit 1
          fi
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG 已经存在"; exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 检查签名密钥
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: go run ./cmd/mkmanifest check-key
      # 更新日志要在打 tag 之前写好：程序把 CHANGELOG.md 打包进自己，设置 → 关于里的"版本历史"和更新窗口都靠它。
      # 没有本版本小节就发出去，这个版本的内容在历史里永远是空的（已发布的程序里改不了），所以在这里直接失败。
      # 正式版必须有；预发布（带连字符的 tag）可以没有。
      - name: 检查更新日志
        run: |
          v="${TAG#v}"
          case "$v" in *-*) echo "预发布版本，跳过更新日志检查"; exit 0;; esac
          if ! grep -qE "^## \[${v//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里没有 ${v} 的小节。请把 [Unreleased] 的内容挪到 \"## [${v}] - 日期\" 下面，合并后重新打 tag。"
            exit 1
          fi

  build:
    needs: preflight
    strategy:
      # 不要因为一个平台失败就取消其他平台：一次跑完才能看到所有平台的问题。
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            tags: ""
            src: build/bin/mosaic.exe
            out: mosaic-windows-amd64.exe
          - os: ubuntu-latest
            platform: linux/amd64
            tags: webkit2_41
            src: build/bin/mosaic
            out: mosaic-linux-amd64
          - os: macos-latest
            platform: darwin/universal
            tags: ""
            src: build/bin/mosaic.app
            out: mosaic-darwin-universal.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: 安装 Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: 测试
        run: |
          go test ./...
          cd frontend && npm ci --no-audit --no-fund && npx tsc --noEmit -p . && npx vitest run
      - name: 打包
        shell: bash
        run: |
          VERSION="${TAG#v}"
          args=(build -platform "${{ matrix.platform }}" -clean -trimpath -ldflags "-X github.com/crazyjums/myllmapp/internal/update.Version=${VERSION}")
          if [ -n "${{ matrix.tags }}" ]; then args+=(-tags "${{ matrix.tags }}"); fi
          wails "${args[@]}"
          mkdir -p dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --keepParent "${{ matrix.src }}" "dist/${{ matrix.out }}"
          else
            cp "${{ matrix.src }}" "dist/${{ matrix.out }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}

  # Electron 版安装包（迁移阶段 5，见 docs/design/electron-migration.md），与 Wails 版并行构建。
  # 失败不影响 Wails 版发布：release 只在 Wails 三平台都成功时运行，Electron 产物有就带上、没有就跳过。
  build-electron:
    needs: preflight
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder: --win
            stage: ""
          - os: ubuntu-latest
            builder: --linux
            stage: ""
          - os: macos-latest
            builder: --mac --universal
            stage: --universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: 构建并打包
        shell: bash
        run: |
          VERSION="${TAG#v}"
          (cd frontend && npm ci --no-audit --no-fund)
          cd desktop
          npm ci --no-audit --no-fund
          npm test
          node scripts/stage.mjs --version "$VERSION" ${{ matrix.stage }}
          npx electron-builder ${{ matrix.builder }} -c.extraMetadata.version="$VERSION"
          ls -lh release
      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.dmg
            desktop/release/*.zip

  release:
    needs: [build, build-electron]
    # build-electron 失败或被跳过也要发布 Wails 版；Wails 版任何平台失败则不发布。
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成并签名更新清单
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_SIGNING_KEY" || { echo "缺少加密变量 UPDATE_SIGNING_KEY"; exit 1; }
          # tag 触发时 tag 已存在；手动运行时还没有，范围终点用当前提交
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then end="$TAG"; else end=HEAD; fi
          prev=$(git describe --tags --abbrev=0 "${end}^" 2>/dev/null || true)
          range=${prev:+$prev..}${end}
          git log --no-merges --pretty='%s' "$range" > commits.txt
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          # Electron 安装包有就放进清单（平台键带 -electron，Wails 客户端看不到）。macOS 不自动更新，不进清单。
          # 文件名由 electron-builder 的 artifactName 决定（Mosaic-<版本>-<系统>-<架构>.<扩展名>），用通配符找，不写死系统/架构那一段。
          electron_assets=()
          win=$(ls dist/Mosaic-*.exe 2>/dev/null | head -n1 || true)
          lin=$(ls dist/Mosaic-*.AppImage 2>/dev/null | head -n1 || true)
          if [ -n "$win" ]; then electron_assets+=(-asset "windows-amd64-electron=$win"); fi
          if [ -n "$lin" ]; then electron_assets+=(-asset "linux-amd64-electron=$lin"); fi
          echo "Electron 资产：${electron_assets[*]:-无}"
          # 更新日志优先取 CHANGELOG.md 里本版本的小节；没有就用提交标题兜底（并输出警告）。
          go run ./cmd/mkmanifest sign -version "${TAG}" -base-url "$base" \
            -changelog CHANGELOG.md -commits-file commits.txt -notes-out notes.md \
            -page "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" -out dist \
            -asset windows-amd64=dist/mosaic-windows-amd64.exe \
            -asset linux-amd64=dist/mosaic-linux-amd64 \
            "${electron_assets[@]}"
          # 更新日志会公开发布：不能带 Claude 会话链接（可能泄露隐私）。mkmanifest 已经清理过，这里再兜底检查一次。
          if grep -qiE 'claude\.(ai|com)/code|Claude-Session|Co-Authored-By' notes.md dist/manifest.json; then
            echo "::error::更新日志里出现了 Claude 会话链接或署名行，请检查 CHANGELOG.md 和提交信息"
            exit 1
          fi
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f notes.md ] || echo "$TAG" > notes.md
          flags=""
          case "$TAG" in *-*) flags="--prerelease";; esac
          # --target：手动运行时 tag 还不存在，会在这个提交上创建；tag 触发时 tag 已存在，--target 被忽略。
          gh release create "$TAG" $flags --target "$BUILD_SHA" --title "$TAG" --notes-file notes.md dist/*
