# Temporary one-off screenshot capture for the README refresh PR.
# Captures only the in-browser fake/demo backend; no real chats, paths, or secrets.
name: readme-screenshots
on:
  push:
    branches: ["docs/readme-refresh-20261101"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.ref == 'refs/heads/docs/readme-refresh-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser demo and screenshot dependencies
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          cd ..
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run frontend and capture real UI
        shell: bash
        run: |
          set -euo pipefail
          (cd frontend && npm run dev -- --host 127.0.0.1 > /tmp/mosaic-vite.log 2>&1) &
          trap 'cat /tmp/mosaic-vite.log' EXIT
          for n in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:5173/ >/dev/null
          python scripts/capture-readme-screenshots.py
      - name: Commit generated screenshots to this PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/readme-workspace.png docs/images/readme-chat.png docs/images/readme-artifacts.png docs/images/readme-plugins.png
          if git diff --cached --quiet; then
            echo 'Screenshots unchanged'
            exit 0
          fi
          git commit -m "docs: refresh README screenshots from current browser demo"
          git push origin HEAD:docs/readme-refresh-20261101
